<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Onboarding Agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: #ffffff;
    border-bottom: 1px solid #e5e5e7;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; color: #6e6e73; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 85%;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 14px;
  }
  .msg.user .bubble { background: #0071e3; color: white; }
  .msg.agent .bubble { background: #ffffff; border: 1px solid #e5e5e7; }
  .sources {
    font-size: 12px;
    color: #6e6e73;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .source-chip {
    background: #eceef0;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .source-chip a { color: inherit; text-decoration: none; }
  .source-chip a:hover { text-decoration: underline; }

  form {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    background: #ffffff;
    border-top: 1px solid #e5e5e7;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #d2d2d7;
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: #0071e3;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #a9c9ec; cursor: default; }
  .hint { color: #6e6e73; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>Onboarding Agent</h1>
    <p>Ask about the codebase or internal docs. Answers cite their sources.</p>
  </header>

  <div id="chat">
    <div class="msg agent">
      <div class="bubble hint">Ask something like "How does authentication work?" or "Where is the payments module?"</div>
    </div>
  </div>

  <form id="form">
    <input id="question" type="text" placeholder="Ask a question..." autocomplete="off" />
    <button id="submit" type="submit">Ask</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('question');
    const submitBtn = document.getElementById('submit');

    function addMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    function addSources(wrap, sources) {
      if (!sources || sources.length === 0) return;
      const box = document.createElement('div');
      box.className = 'sources';
      sources.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'source-chip';
        if (s.url) {
          const a = document.createElement('a');
          a.href = s.url;
          a.target = '_blank';
          a.textContent = s.source;
          chip.appendChild(a);
        } else {
          chip.textContent = s.source;
        }
        box.appendChild(chip);
      });
      wrap.appendChild(box);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage('user', question);
      input.value = '';
      submitBtn.disabled = true;
      const thinking = addMessage('agent', 'Thinking...');

      try {
        const resp = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await resp.json();
        thinking.querySelector('.bubble').textContent = resp.ok
          ? data.answer
          : ('Error: ' + (data.detail || 'something went wrong'));
        if (resp.ok) addSources(thinking, data.sources);
      } catch (err) {
        thinking.querySelector('.bubble').textContent = 'Error: could not reach the server.';
      } finally {
        submitBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
